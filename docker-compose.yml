services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no arquivo .env}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?Defina POSTGRES_DB no arquivo .env}
      DB_USERNAME: ${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      SEED_PASSWORD: ${SEED_PASSWORD:?Defina SEED_PASSWORD no arquivo .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Defina ADMIN_EMAIL no arquivo .env}
      PARTICIPANT_EMAIL: ${PARTICIPANT_EMAIL:?Defina PARTICIPANT_EMAIL no arquivo .env}
      ORGANIZER_EMAIL: ${ORGANIZER_EMAIL:?Defina ORGANIZER_EMAIL no arquivo .env}
      TZ: UTC
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  postgres_data:
