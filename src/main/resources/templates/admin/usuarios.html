<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout('Administração', ~{::main})}">
<body><main class="container flex-grow-1 py-4">
    <h1>Administração de usuários</h1>
    <p><a class="btn btn-outline-primary" th:href="@{/admin/categorias}">Gerenciar categorias</a></p>
    <div class="alert alert-success" role="status" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>
    <p>Ao retirar o papel de organizador, os eventos em rascunho serão encerrados. Eventos publicados impedem a retirada.</p>
    <div class="table-responsive">
        <table class="table align-middle">
            <thead><tr><th scope="col">Nome</th><th scope="col">Email</th><th scope="col">Perfil</th><th scope="col">Ação</th></tr></thead>
            <tbody><tr th:each="user : ${users}">
                <td th:text="${user.name}"></td><td th:text="${user.email}"></td>
                <td><span th:each="role : ${user.roles}" th:text="${#strings.replace(role.name, 'ROLE_', '')}"></span></td>
                <td><th:block th:each="role : ${user.roles}">
                    <form th:if="${role.name == 'ROLE_PARTICIPANTE'}" th:action="@{/admin/usuarios/{id}/organizador(id=${user.id})}" method="post">
                        <input type="hidden" name="_method" value="put">
                        <button class="btn btn-primary btn-sm" type="submit">Conceder organizador</button>
                    </form>
                    <form th:if="${role.name == 'ROLE_ORGANIZADOR'}" th:action="@{/admin/usuarios/{id}/organizador(id=${user.id})}" method="post">
                        <input type="hidden" name="_method" value="delete">
                        <button class="btn btn-outline-danger btn-sm" type="submit">Retirar organizador</button>
                    </form>
                    <span th:if="${role.name == 'ROLE_ADMIN'}">Não disponível</span>
                </th:block></td>
            </tr></tbody>
        </table>
    </div>
</main></body></html>
