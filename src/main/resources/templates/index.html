<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout('Eventos', ~{::main})}">
<body><main class="container flex-grow-1 py-4">
    <h1>Eventos</h1>
    <form method="get" th:action="@{/}" class="row g-2 align-items-end mb-4">
        <div class="col-sm-6 col-lg-4"><label for="categoria" class="form-label">Categoria</label>
            <select id="categoria" name="categoria" class="form-select">
                <option value="">Todas as categorias</option>
                <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}" th:selected="${category.id == categoryId}"></option>
            </select>
        </div>
        <div class="col-auto"><button class="btn btn-primary" type="submit">Filtrar</button></div>
    </form>
    <p th:if="${events.empty}">Nenhum evento encontrado.</p>
    <div class="row g-3">
        <div class="col-md-6 col-lg-4" th:each="event : ${events.content}">
            <article class="card h-100"><div class="card-body d-flex flex-column">
                <h2 class="h5 card-title" th:text="${event.title}"></h2>
                <p class="card-text" th:text="${event.category.name}"></p>
                <p class="card-text" th:text="${#temporals.format(event.startDate, 'dd/MM/yyyy')} + ' a ' + ${#temporals.format(event.endDate, 'dd/MM/yyyy')}"></p>
                <p class="card-text" th:text="${event.location}"></p>
                <a class="btn btn-outline-primary mt-auto align-self-start" th:href="@{/eventos/{id}(id=${event.id})}">Ver evento</a>
            </div></article>
        </div>
    </div>
    <nav th:if="${events.totalPages > 1}" aria-label="Páginas de eventos" class="mt-4">
        <ul class="pagination flex-wrap">
            <li class="page-item" th:classappend="${events.first} ? 'disabled'"><a class="page-link" th:href="@{/(categoria=${categoryId},pagina=${events.number - 1})}">Anterior</a></li>
            <li class="page-item" th:each="number : ${#numbers.sequence(0, events.totalPages - 1)}" th:classappend="${number == events.number} ? 'active'"><a class="page-link" th:href="@{/(categoria=${categoryId},pagina=${number})}" th:text="${number + 1}" th:attr="aria-current=${number == events.number} ? 'page' : null"></a></li>
            <li class="page-item" th:classappend="${events.last} ? 'disabled'"><a class="page-link" th:href="@{/(categoria=${categoryId},pagina=${events.number + 1})}">Próxima</a></li>
        </ul>
    </nav>
</main></body></html>
