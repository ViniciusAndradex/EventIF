<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout('Entrar', ~{::main})}">

<body>
    <main class="container flex-grow-1 py-4">
        <h1>Entrar</h1>
        <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
        <div class="alert alert-danger" th:if="${param.error}">Email ou senha inválidos.</div>
        <div class="alert alert-success" th:if="${param.logout}">Você saiu da sua conta.</div>
        <form th:action="@{/login}" method="post">
            <label for="email">Email</label><input class="form-control" id="email" name="email" type="email" required>
            <label for="password">Senha</label><input class="form-control" id="password" name="password" type="password"
                required>
            <button class="btn btn-primary mt-3" type="submit">Entrar</button>
        </form><a th:href="@{/cadastro}">Criar conta</a>
    </main>
</body>

</html>
