<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout('Inscritos', ~{::main})}">
<body><main class="container flex-grow-1 py-4">
    <h1>Inscritos</h1>
    <p><strong>Evento:</strong> <span th:text="${roster.event.title}"></span><br>
       <strong>Atividade:</strong> <span th:text="${roster.activity.title}"></span></p>
    <a th:href="@{/organizador/eventos/{id}/atividades(id=${roster.event.id})}">Voltar às atividades</a>
    <div class="alert alert-success mt-3" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-danger mt-3" th:if="${error}" th:text="${error}"></div>
    <p class="mt-3" th:if="${#lists.isEmpty(roster.enrollments)}">Nenhuma inscrição nesta atividade.</p>
    <div class="table-responsive mt-3" th:unless="${#lists.isEmpty(roster.enrollments)}"><table class="table align-middle">
        <thead><tr><th>Participante</th><th>Email</th><th>Presença</th><th>Ações</th></tr></thead>
        <tbody><tr th:each="enrollment : ${roster.enrollments}">
            <td th:text="${enrollment.user.name}"></td><td th:text="${enrollment.user.email}"></td>
            <td th:text="${enrollment.present} ? 'Presente' : 'Não registrada'"></td>
            <td><form th:if="${roster.canMark and !enrollment.present}" th:action="@{/organizador/eventos/{eventId}/atividades/{activityId}/inscricoes/{id}/presenca(eventId=${roster.event.id},activityId=${roster.activity.id},id=${enrollment.id})}" method="post">
                <input type="hidden" name="_method" value="put">
                <button type="submit" class="btn btn-primary btn-sm">Marcar presença</button>
            </form></td>
        </tr></tbody>
    </table></div>
</main></body></html>
