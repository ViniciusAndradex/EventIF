<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
    th:replace="~{fragments/layout :: layout('Inscritos', ~{::main})}">

<body>
    <main class="container flex-grow-1 py-4">
        <h1>Inscritos</h1>
        <p><strong>Evento:</strong> <span th:text="${roster.event.title}"></span><br>
            <strong>Atividade:</strong> <span th:text="${roster.activity.title}"></span>
        </p>
        <a th:href="@{/organizador/eventos/{id}/atividades(id=${roster.event.id})}">Voltar às atividades</a>
        <div class="alert alert-success mt-3" th:if="${success}" th:text="${success}"></div>
        <div class="alert alert-danger mt-3" th:if="${error}" th:text="${error}"></div>
        <p class="mt-3" th:if="${#lists.isEmpty(roster.enrollments)}">Nenhuma inscrição nesta atividade.</p>
        <form th:unless="${#lists.isEmpty(roster.enrollments)}" method="post"
            th:action="@{/organizador/eventos/{eventId}/atividades/{activityId}/inscricoes/presenca(eventId=${roster.event.id},activityId=${roster.activity.id})}">
            <input type="hidden" name="_method" value="put">
            <p class="text-body-secondary mt-3" th:unless="${roster.canMark}">A presença só pode ser registrada durante
                a atividade e enquanto o evento não estiver encerrado.</p>
            <div class="table-responsive mt-3">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>Presente</th>
                            <th>Participante</th>
                            <th>Email</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="enrollment : ${roster.enrollments}">
                            <td><input class="form-check-input" type="checkbox" name="presentes"
                                    th:id="'presente-' + ${enrollment.id}" th:value="${enrollment.id}"
                                    th:checked="${enrollment.present}" th:disabled="${!roster.canMark}"></td>
                            <td><label th:for="'presente-' + ${enrollment.id}"
                                    th:text="${enrollment.user.name}"></label></td>
                            <td th:text="${enrollment.user.email}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <button th:if="${roster.canMark}" type="submit" class="btn btn-primary">Salvar presenças</button>
        </form>
    </main>
</body>

</html>
