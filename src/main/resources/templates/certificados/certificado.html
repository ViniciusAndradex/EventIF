<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title>Certificado | EventIF</title>
    <style>
        @page {
            size: A4 landscape;
            margin: 15mm;
        }

        body {
            font-family: sans-serif;
            color: #1b3043;
            text-align: center;
        }

        .certificate {
            border: 3px solid #1b6355;
            padding: 45px 35px;
            margin: 20px auto;
        }

        h1 {
            font-size: 38px;
            margin: 35px 0;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
        }

        .name {
            font-size: 28px;
            font-weight: bold;
        }

        .actions {
            margin: 20px;
        }

        .actions a,
        .actions button {
            margin: 0 8px;
            font-size: 16px;
        }

        @media print {
            .actions {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div class="actions" th:if="${!pdf}">
        <a th:href="@{/certificados}">Meus certificados</a>
        <button type="button" onclick="window.print()">Imprimir</button>
        <a th:href="@{/certificados/{id}/pdf(id=${certificate.eventId})}">Abrir PDF</a>
    </div>
    <div class="certificate">
        <div>EventIF</div>
        <h1>Certificado</h1>
        <p>Certificamos que</p>
        <p class="name" th:text="${certificate.participantName}">Participante</p>
        <p>participou do evento <strong th:text="${certificate.eventTitle}">Evento</strong>,<br />
            com carga horária total de <strong th:text="${certificate.formattedWorkload()}">0 horas</strong>.</p>
    </div>
</body>

</html>
